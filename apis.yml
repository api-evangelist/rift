aid: rift
name: Rift
description: >-
  Rift is a decentralized exchange (DEX) aggregator that routes swap orders
  across 20+ trading venues and cross-chain bridges to guarantee best-price
  execution with zero added fees. Its Router API (v3, currently in beta) lets
  developers request a best-price market quote for an asset swap, create a
  market order against that quote with an idempotency key, and check the online
  status of both the Rift service and each downstream execution provider
  (Across, CCTP, Hyperliquid, KyberSwap, and more). Rift is backed by Paradigm,
  WTG Ventures, Edge Capital, and 20+ angel investors.
